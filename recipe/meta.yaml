{% set name = "arviz" %}
{% set version = "1.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9e332c0a0da370cb1c00823678065e9b0462fbdf1efa0f38c37485cc78c8a576

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<312]

requirements:
  host:
    - python
    - pip
    - flit-core >=3.4,<4
  run:
    - python
    - arviz-base >=1.3.0,<1.4.0
    - arviz-stats >=1.3.0,<1.4.0
    # arviz-stats[xarray]>=1.3,<1.4: xarray-einstats", "xarray>=2024.11.0"
    # see https://github.com/arviz-devs/arviz-stats/blob/v1.3.0/pyproject.toml
    - xarray-einstats
    - xarray >=2024.11.0
    - arviz-plots >=1.3.0,<1.4.0
  run_constrained:
    # optional plotting extras: arviz[matplotlib|bokeh|plotly] delegate to arviz_plots extras (matplotlib>=3.9, bokeh>=3.4, plotly>=5.19)
    # see https://github.com/arviz-devs/arviz/blob/v1.3.0/pyproject.toml#L47-L49
    - matplotlib-base >=3.9
    - bokeh >=3.4
    - plotly >=5.19

test:
  imports:
    - arviz
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://python.arviz.org
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Exploratory analysis of Bayesian models with Python
  description: |
    ArviZ (pronounced "AR-vees") is a Python package for exploratory analysis
    of Bayesian models. Includes functions for posterior analysis, model
    checking, comparison and diagnostics.
  doc_url: https://python.arviz.org
  dev_url: https://github.com/arviz-devs/arviz

extra:
  recipe-maintainers:
    - ericmjl
    - canyon289
    - aloctavodia
    - ColCarroll
    - ahartikainen
